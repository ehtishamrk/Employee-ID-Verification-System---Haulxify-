<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verify Employee — HAULXIFY</title>
  <link rel="icon" href="assets/logo.webp">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="verify-shell">
    <section class="verify-card">
      <div class="brand-row">
        <img src="assets/logo.webp" alt="HAULXIFY">
        <span>EMPLOYEE VERIFICATION</span>
      </div>

      <div id="state" class="state">
        <div class="spinner"></div>
        <p>Verifying card…</p>
      </div>

      <div id="employee" class="employee hidden"></div>
      <div id="error" class="error hidden"></div>
      <div id="footer" class="verify-footer hidden">
        <span>HAULXIFY</span>
        <span id="verifiedAt"></span>
      </div>
    </section>
  </main>

  <script type="module" src="js/verify.js"></script>
</body>
</html>
