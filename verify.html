<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1f38">
  <meta name="description" content="Secure digital identity verification for HAULXIFY employees.">
  <title>Verify — HAULXIFY</title>
  <link rel="icon" href="assets/logo-sm.webp">
  <!-- No web fonts on this page by design — every extra origin here delays
       the one thing this page exists to do: show a scanned card fast.
       System fonts render instantly with no network round trip. -->
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="verify-body">
  <main class="verify-shell">
    <section class="verify-card">
      <div class="badge-header">
        <div class="badge-brand">
          <img class="badge-logo" src="assets/logo-sm.webp" alt="">
          <div class="badge-brand-text">
            <strong>HAULXIFY</strong>
            <span id="badgeSubtitle">Secure Employee Verification</span>
          </div>
        </div>
        <div class="badge-photo-ring">
          <div class="badge-photo-fallback skeleton" id="photoSkeleton"></div>
        </div>
      </div>

      <div id="state" class="state">
        <div class="skeleton skeleton-line" style="width:52%;height:19px;margin:10px auto 8px"></div>
        <div class="skeleton skeleton-line" style="width:34%;height:13px;margin-bottom:24px"></div>
        <div class="skeleton-grid">
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
          <div class="skeleton skeleton-box"></div>
        </div>
        <p class="state-caption" id="stateCaption">Checking card against HAULXIFY records…</p>
      </div>

      <div id="employee" class="employee hidden"></div>
      <div id="passPanel" class="employee hidden"></div>
      <div id="error" class="error-state hidden"></div>

      <div id="footer" class="verify-footer hidden">
        <span class="footer-brand">HAULXIFY Secure ID</span>
        <span id="verifiedAt"></span>
      </div>
    </section>

    <p class="verify-disclaimer" id="verifyDisclaimer">This page confirms employment identity only. It does not grant physical, network, or system access.</p>

    <div id="staffBar" class="staff-bar">
      <button id="staffToggle" class="staff-toggle" type="button">Staff sign-in</button>
      <form id="staffForm" class="staff-form hidden">
        <input id="staffEmail" type="email" placeholder="Email" autocomplete="username" required>
        <input id="staffPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn primary small" type="submit">Sign in</button>
        <span id="staffError" class="staff-error hidden"></span>
      </form>
      <div id="staffSignedIn" class="staff-signedin hidden">
        Signed in as <strong id="staffEmailLabel"></strong>
        <button id="staffSignOut" type="button">Sign out</button>
      </div>
    </div>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script type="module" src="js/verify.js"></script>
</body>
</html>
